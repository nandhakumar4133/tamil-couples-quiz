
<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>காதல் வினாடி வினா ❤️</title>
  <style>
    body {
      font-family: sans-serif;
      background: linear-gradient(135deg, #ffe0ec, #f8b4d9);
      text-align: center;
      padding: 30px 15px;
      color: #8b1748;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      max-width: 400px;
      margin: 40px auto;
      box-shadow: 0 5px 20px #d88aaa;
    }
    button {
      background: #e83e8c;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>❤️ காதல் வினாடி வினா ❤️</h1>
    <p>உங்களுக்குப் பிடித்த ஒருவரின் பெயரை மனதில் நினைத்துக் கொள்ளுங்கள்.</p>
    <p>அந்த நபரை நினைத்துக்கொண்டே கேள்விகளுக்குப் பதிலளியுங்கள்!</p>
    <button onclick="startQuiz()">தொடங்கலாம் ❤️</button>
    <p id="message"></p>
  </div>

  <script>
    function startQuiz() {
      document.getElementById("message").textContent =
        "நம்ம காதல் விளையாட்டு விரைவில் தொடங்கும்! 💕";
    }
  </script>
</body>
</html>
